name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: "Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Vox-Client-linux.tar.gz
          - os: macos-latest
            artifact: Vox-Client-macos.dmg
          - os: windows-latest
            artifact: Vox-Client-windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Get pip cache dir
        id: pip-cache
        shell: bash
        run: echo "dir=$(pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ matrix.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.os }}-

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Create venv and install deps
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Create venv and install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller vox-client.spec --noconfirm
        if: runner.os != 'Windows'

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m PyInstaller vox-client.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Vox Client" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Vox Client.app" 150 200 \
            --app-drop-link 450 200 \
            "${{ matrix.artifact }}" \
            "dist/Vox Client.app"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf "${{ matrix.artifact }}" -C dist vox-client

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\vox-client" -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
