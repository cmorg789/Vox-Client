name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: "Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Vox-Client-linux.tar.gz
          - os: macos-latest
            artifact: Vox-Client-macos.zip
          - os: windows-latest
            artifact: Vox-Client-windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Download SDK wheels
        run: gh release download --repo cmorg789/vox-py-sdk --pattern "*.whl" --dir sdk-wheels
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create venv and install deps
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/pip install --find-links sdk-wheels/ -e ".[dev]"

      - name: Create venv and install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --find-links sdk-wheels/ -e ".[dev]"

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller vox-client.spec --noconfirm
        if: runner.os != 'Windows'

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m PyInstaller vox-client.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r "../${{ matrix.artifact }}" "Vox Client.app"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf "${{ matrix.artifact }}" -C dist vox-client

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\vox-client" -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
