name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: "Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Vox-Client-linux.tar.gz
          - os: macos-latest
            artifact: Vox-Client-macos.dmg
          - os: windows-latest
            artifact: Vox-Client-windows.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          rm -f pyproject.toml.bak

      - name: Get pip cache dir
        id: pip-cache
        shell: bash
        run: echo "dir=$(pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ matrix.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.os }}-

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Create venv and install deps
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install dav1d:x64-windows
          $dll = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\dav1d.dll" -ErrorAction SilentlyContinue
          if ($dll) {
            Write-Host "Found dav1d.dll at $($dll.FullName)"
            echo "DAV1D_DLL=$($dll.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Host "::error::dav1d.dll not found after vcpkg install"
            Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" -Recurse -Filter "*.dll" | ForEach-Object { $_.FullName }
            exit 1
          }

      - name: Create venv and install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller vox-client.spec --noconfirm
        if: runner.os != 'Windows'

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m PyInstaller vox-client.spec --noconfirm

      - name: Ensure dav1d.dll in bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "dist\vox-client\_internal\dav1d.dll"
          if (Test-Path $target) {
            Write-Host "dav1d.dll already in bundle (placed by PyInstaller)"
          } elseif ($env:DAV1D_DLL -and (Test-Path $env:DAV1D_DLL)) {
            Copy-Item $env:DAV1D_DLL $target
            Write-Host "Copied dav1d.dll from $env:DAV1D_DLL to bundle"
          } else {
            Write-Host "::error::dav1d.dll not available to bundle"
            exit 1
          }

      - name: Verify native extension bundled
        shell: bash
        run: |
          echo "Checking for vox_media native extension in bundle..."
          if ls dist/vox-client/_internal/vox_media/vox_media.*.so 2>/dev/null || \
             ls dist/vox-client/_internal/vox_media/vox_media.*.pyd 2>/dev/null; then
            echo "✓ vox_media native extension found"
          else
            echo "✗ vox_media native extension NOT found — audio will not work!"
            echo "Bundle contents of vox_media/:"
            ls -la dist/vox-client/_internal/vox_media/ 2>/dev/null || echo "  (directory missing)"
            exit 1
          fi
          # On Windows, verify vendored DLLs are present (delvewheel .libs dir)
          if [ "$RUNNER_OS" = "Windows" ]; then
            for d in dist/vox-client/_internal/vox_media.libs dist/vox-client/_internal/.vox_media.libs; do
              if [ -d "$d" ]; then
                echo "✓ Vendored DLL directory found: $d"
                ls -la "$d"
              fi
            done
            # Also check for DLLs alongside the .pyd
            echo "DLLs in vox_media/:"
            ls dist/vox-client/_internal/vox_media/*.dll 2>/dev/null || echo "  (none)"
          fi

      - name: List DLL dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist\vox-client\_internal\vox_media\*.pyd | ForEach-Object {
            Write-Host "=== Dependencies of $($_.Name) ==="
            & .venv\Scripts\python -c "import pefile; pe = pefile.PE(r'$($_.FullName)'); [print(e.dll.decode()) for e in pe.DIRECTORY_ENTRY_IMPORT]"
          }
          Write-Host "`n=== All DLLs in _internal/ ==="
          Get-ChildItem dist\vox-client\_internal\*.dll -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          Write-Host "`n=== All files in vox_media/ ==="
          Get-ChildItem dist\vox-client\_internal\vox_media\ -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          Write-Host "`n=== vox_media.libs/ ==="
          Get-ChildItem dist\vox-client\_internal\vox_media.libs\ -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          if (-not (Test-Path dist\vox-client\_internal\vox_media.libs)) { Write-Host "(not found)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Vox Client" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Vox Client.app" 150 200 \
            --app-drop-link 450 200 \
            "${{ matrix.artifact }}" \
            "dist/Vox Client.app"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf "${{ matrix.artifact }}" -C dist vox-client

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\vox-client" -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
