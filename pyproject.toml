[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox-client"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "qasync>=0.27",
    "catppuccin==2.5",
    # vox-sdk and vox-media are published on PyPI.
    "vox-sdk[media,mls]>=0.1",
]

[project.optional-dependencies]
dev = [
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "pyinstaller>=6.0",
]

[project.scripts]
vox-client = "vox_client.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_client"]
