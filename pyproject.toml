[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox-client"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "PyQt6>=6.8",
    "qasync>=0.27",
    "catppuccin==2.5",
    # vox-sdk is distributed via GitHub Releases (not PyPI).
    # First: gh release download --repo cmorg789/vox-py-sdk --pattern "*.whl" --dir sdk-wheels
    # Then:  pip install --find-links sdk-wheels/ -e '.[dev]'
    "vox-sdk[media]>=0.1",
]

[project.optional-dependencies]
dev = [
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "pyinstaller>=6.0",
]

[project.scripts]
vox-client = "vox_client.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_client"]
